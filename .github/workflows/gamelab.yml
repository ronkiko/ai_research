name: GameLab checks

on:
  push:
    paths:
      - "gamelab/**"
      - "gameserver/v1/**"
      - "gameclient/v1/host/**"
      - "gameclient/v1/clients/base.py"
      - "gameclient/v1/op/host.sh"
      - ".github/workflows/gamelab.yml"
  pull_request:
    paths:
      - "gamelab/**"
      - "gameserver/v1/**"
      - "gameclient/v1/host/**"
      - "gameclient/v1/clients/base.py"
      - "gameclient/v1/op/host.sh"
      - ".github/workflows/gamelab.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Prepare isolated GameLab environment
        run: ./gamelab/op/setup.sh --isolated
      - name: Full GameLab machine gate
        env:
          GAMELAB_PYTHON: ${{ github.workspace }}/gamelab/.venv/bin/python
        run: ./gamelab/op/check.sh
