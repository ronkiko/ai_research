name: GameTable checks

on:
  push:
    paths:
      - "gametable/**"
      - "gamelab/mcp.py"
      - ".opencode/skills/gamelab/SKILL.md"
      - ".github/workflows/gametable.yml"
  pull_request:
    paths:
      - "gametable/**"
      - "gamelab/mcp.py"
      - ".opencode/skills/gamelab/SKILL.md"
      - ".github/workflows/gametable.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: GameTable contract
        run: ./gametable/op/check.sh
