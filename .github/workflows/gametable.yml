name: GameTable checks

on:
  push:
    paths:
      - "gametable/**"
      - "gamelab/mcp.py"
      - "gamelab/lab_service.py"
      - "gamelab/op/gamelab.sh"
      - "gamelab/op/_env.sh"
      - "gameclient/v1/op/mcp.sh"
      - "gameclient/v1/op/mcp-setup.sh"
      - "gameclient/v1/requirements-mcp.txt"
      - ".opencode/skills/gamelab/SKILL.md"
      - "op/process.sh"
      - "op/test-process.sh"
      - ".github/workflows/gametable.yml"
  pull_request:
    paths:
      - "gametable/**"
      - "gamelab/mcp.py"
      - "gamelab/lab_service.py"
      - "gamelab/op/gamelab.sh"
      - "gamelab/op/_env.sh"
      - "gameclient/v1/op/mcp.sh"
      - "gameclient/v1/op/mcp-setup.sh"
      - "gameclient/v1/requirements-mcp.txt"
      - ".opencode/skills/gamelab/SKILL.md"
      - ".github/workflows/gametable.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Managed launcher smoke
        run: ./op/test-process.sh
      - name: GameTable contract
        run: ./gametable/op/check.sh
