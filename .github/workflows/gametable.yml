name: GameTable checks

on:
  push:
    paths:
      - "gametable/**"
      - "graphics/**"
      - "player-gateway/**"
      - "organism/**"
      - "world/catalog.py"
      - "world/maps/**"
      - "world/navigation.py"
      - "world/navigation_store.py"
      - "world/navigation_runtime.py"
      - "world/mcp.py"
      - "gameserver/v1/world/**"
      - "gameserver/v1/gateway/embodied.py"
      - "gameserver/v1/embodied_supervisor.py"
      - "gameserver/v1/op/embodied.sh"
      - "gameclient/v1/host/**"
      - "gameclient/v1/clients/base.py"
      - "gameclient/v1/op/host.sh"
      - "gameclient/v1/op/director-host.sh"
      - "gameclient/v1/op/director-gui.sh"
      - "gameclient/v1/clients/gui.py"
      - "docs/refactor/embodied-vn/10-director-escort.md"
      - "docs/refactor/embodied-vn/11-acceptance.md"
      - "docs/reports/embodied-vn-acceptance.md"
      - "op/process.sh"
      - "op/test-process.sh"
      - ".github/workflows/gametable.yml"
  pull_request:
    paths:
      - "gametable/**"
      - "graphics/**"
      - "player-gateway/**"
      - "organism/**"
      - "world/catalog.py"
      - "world/maps/**"
      - "world/navigation.py"
      - "world/navigation_store.py"
      - "world/navigation_runtime.py"
      - "world/mcp.py"
      - "gameserver/v1/world/**"
      - "gameserver/v1/gateway/embodied.py"
      - "gameserver/v1/embodied_supervisor.py"
      - "gameserver/v1/op/embodied.sh"
      - "gameclient/v1/host/**"
      - "gameclient/v1/clients/base.py"
      - "gameclient/v1/op/host.sh"
      - "gameclient/v1/op/director-host.sh"
      - "gameclient/v1/op/director-gui.sh"
      - "gameclient/v1/clients/gui.py"
      - "docs/refactor/embodied-vn/10-director-escort.md"
      - "docs/refactor/embodied-vn/11-acceptance.md"
      - "docs/reports/embodied-vn-acceptance.md"
      - "op/process.sh"
      - "op/test-process.sh"
      - ".github/workflows/gametable.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Managed launcher smoke
        run: ./op/test-process.sh
      - name: GameTable contract
        run: ./gametable/op/check.sh
