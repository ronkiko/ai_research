name: Embodied world contracts

on:
  push:
    paths:
      - "world/**"
      - "organism/**"
      - "docs/refactor/embodied-vn/02-contracts.md"
      - "docs/refactor/embodied-vn/05-navigation.md"
      - "docs/refactor/embodied-vn/08-learning.md"
      - "docs/refactor/embodied-vn/09-cutover.md"
      - "docs/refactor/embodied-vn/10-director-escort.md"
      - "ARCHITECTURE.md"
      - "README.md"
      - ".github/workflows/world.yml"
  pull_request:
    paths:
      - "world/**"
      - "organism/**"
      - "docs/refactor/embodied-vn/02-contracts.md"
      - "docs/refactor/embodied-vn/05-navigation.md"
      - "docs/refactor/embodied-vn/08-learning.md"
      - "docs/refactor/embodied-vn/09-cutover.md"
      - "docs/refactor/embodied-vn/10-director-escort.md"
      - "ARCHITECTURE.md"
      - "README.md"
      - ".github/workflows/world.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: World contract tests
        run: ./world/op/check.sh
