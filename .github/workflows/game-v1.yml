name: Game v1 checks

on:
  push:
    paths:
      - "gameserver/v1/**"
      - "gameclient/v1/**"
      - "op/process.sh"
      - "op/test-process.sh"
      - ".github/workflows/game-v1.yml"
  pull_request:
    paths:
      - "gameserver/v1/**"
      - "gameclient/v1/**"
      - ".github/workflows/game-v1.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Managed launcher smoke
        run: ./op/test-process.sh
      - name: Compile Python
        run: python -m compileall -q gameserver/v1 gameclient/v1
      - name: GameServer tests
        run: python -m unittest discover -s gameserver/v1/tests -v
      - name: GameClient tests
        run: python -m unittest discover -s gameclient/v1/tests -v
      - name: Real Server Host CLI smoke
        run: python gameclient/v1/tests/smoke_runtime.py
      - name: Setup isolated MCP SDK
        run: ./gameclient/v1/op/mcp-setup.sh
      - name: Real Server Host MCP stdio smoke
        run: gameclient/v1/.venv-mcp/bin/python gameclient/v1/tests/smoke_mcp.py
